{{ define "modal_login_prompt.html" }}
<dialog id="login-prompt-modal" class="backdrop:bg-black/50 bg-transparent p-0 w-full max-w-sm m-auto shadow-2xl border border-white/20">
    <div class="bg-surface-dark/95 backdrop-blur-xl relative flex flex-col p-8 overflow-hidden">
        <button type="button" onclick="this.closest('dialog').close()" 
            class="absolute right-4 top-4 text-white/50 hover:text-white transition-colors z-50">
            <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
        
        <div class="flex flex-col items-center gap-6 py-4">
            <div class="flex flex-col items-center gap-2 text-center">
                <span class="material-symbols-outlined text-earth-ochre text-[48px] mb-2">lock_person</span>
                <h2 class="text-2xl font-bold font-serif text-white tracking-tight italic">Sign In Required</h2>
                <p class="text-sm text-white/60 font-medium">You need to be signed in to post a listing.</p>
            </div>

            <div class="w-full space-y-3">
                <a href="/auth/google/login" 
                    class="flex items-center justify-center gap-3 w-full bg-white text-earth-dark h-12 font-bold transition-all hover:bg-earth-cream active:scale-[0.98]">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path class="fill-google-blue" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path class="fill-google-green" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path class="fill-google-yellow" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path class="fill-google-red" d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </a>
                
                <button type="button" onclick="this.closest('dialog').close()"
                    class="w-full h-12 border border-white/10 text-white/70 font-bold hover:bg-white/5 transition-colors">
                    Maybe Later
                </button>
            </div>
        </div>
    </div>
</dialog>
{{ end }}
