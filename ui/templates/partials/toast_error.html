<div id="toast-{{ .ID }}" data-toast-auto-dismiss="5000"
    class="fixed top-4 right-4 z-50 max-w-sm w-full bg-earth-dark/95 border border-red-500/40 shadow-2xl p-4 flex items-start gap-3 animate-in slide-in-from-top-2 fade-in rounded-none"
    role="alert">
    <span class="material-symbols-outlined text-red-500 text-[20px] mt-0.5" aria-hidden="true">error</span>
    <div class="flex-1 min-w-0">
        <p class="text-sm font-bold text-white">{{ .Title }}</p>
        <p class="text-sm text-earth-cream/80 mt-1">{{ .Message }}</p>
    </div>
    <button hx-on:click="closeToast('toast-{{ .ID }}')"
        aria-label="Close notification"
        class="text-earth-sand/70 hover:text-white transition-colors">
        <span class="material-symbols-outlined text-[18px]">close</span>
    </button>
</div>
