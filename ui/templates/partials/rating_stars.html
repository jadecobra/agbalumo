{{ define "rating_stars" }}
<div class="flex items-center gap-1" title="{{ printf "%.1f" .Rating }} stars from {{ .ReviewCount }} reviews">
    <div class="flex items-center -space-x-0.5">
        {{ $rating := .Rating }}
        {{ range $i := seq 1 5 }}
            {{ $f := float64 $i }}
            {{ if ge $rating $f }}
                <span class="text-xs md:text-sm opacity-100 grayscale-0" aria-hidden="true">🍊</span>
            {{ else if ge $rating (subF $f 0.5) }}
                <span class="text-xs md:text-sm opacity-70 grayscale-[0.5]" aria-hidden="true">🍊</span>
            {{ else }}
                <span class="text-xs md:text-sm opacity-30 grayscale" aria-hidden="true">🍊</span>
            {{ end }}
        {{ end }}
    </div>
    <span class="text-[11px] md:text-xs font-bold text-earth-ochre dark:text-yellow-600 ml-1" data-testid="listing-rating-value">
        {{ printf "%.1f" .Rating }} <span class="text-text-sub dark:text-stone-400 font-medium">({{ .ReviewCount }})</span>
    </span>
</div>
{{ end }}
