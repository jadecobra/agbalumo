{{ define "listing_form_type_origin" }}
<!-- Type -->
<div class="flex flex-col gap-1.5 z-20">
    <label id="listing-type-label" for="listing-type-btn" class="text-[10px] font-bold uppercase tracking-widest text-earth-sand/90 ml-1">Type</label>
    <div class="custom-dropdown relative w-full z-10">
        <input id="listing-type" type="hidden" name="type" value="{{ if .SelectedType }}{{ .SelectedType }}{{ else }}Food{{ end }}" required>
        <button id="listing-type-btn" type="button" data-dropdown-toggle
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-labelledby="listing-type-label"
            class="w-full bg-earth-dark/40 border border-earth-accent/30 focus-within:border-earth-accent px-4 py-3 h-12 flex justify-between items-center text-white font-light text-base outline-none transition-all cursor-pointer rounded-none">
            <span class="dropdown-display pointer-events-none">{{ if .SelectedType }}{{ if eq .SelectedType "Food" }}Food/Restaurant{{ else }}{{ .SelectedType }}{{ end }}{{ else }}Food/Restaurant{{ end }}</span>
            <span class="material-symbols-outlined text-[20px] text-earth-accent pointer-events-none">expand_more</span>
        </button>
        <div class="dropdown-menu hidden absolute top-full left-0 w-full mt-1 bg-earth-espresso border border-earth-accent/40 text-earth-cream shadow-2xl z-50 max-h-60 overflow-y-auto rounded-none"
            role="listbox" aria-labelledby="listing-type-label">
            {{ range .Categories }}
            <button type="button" data-dropdown-value="{{ .Name }}"
                role="option"
                aria-selected="{{ if eq $.SelectedType .Name }}true{{ else }}false{{ end }}"
                class="w-full text-left px-5 py-3 text-[10px] font-bold uppercase tracking-widest transition-colors border-b border-earth-accent/10 cursor-pointer {{ if eq $.SelectedType .Name }}bg-earth-accent/20 text-earth-accent font-extrabold{{ else }}hover:bg-earth-accent/10 text-earth-cream{{ end }}">
                {{ if eq .Name "Food" }}Food/Restaurant{{ else }}{{ .Name }}{{ end }}
            </button>
            {{ end }}
        </div>
    </div>
</div>

<!-- Origin -->
<div class="flex flex-col gap-1.5 z-10 mt-1">
    <label id="listing-origin-label" for="listing-origin-btn" class="text-[10px] font-bold uppercase tracking-widest text-earth-sand/90 ml-1">Origin</label>
    <div class="custom-dropdown relative w-full z-10">
        <input id="listing-origin" type="hidden" name="owner_origin" value="{{ if .SelectedOrigin }}{{ .SelectedOrigin }}{{ else }}Nigeria{{ end }}" required>
        <button id="listing-origin-btn" type="button" data-dropdown-toggle
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-labelledby="listing-origin-label"
            class="w-full bg-earth-dark/40 border border-earth-accent/30 focus-within:border-earth-accent px-4 py-3 h-12 flex justify-between items-center text-white font-light text-base outline-none transition-all cursor-pointer rounded-none">
            <span class="dropdown-display pointer-events-none">{{ if .SelectedOrigin }}{{ .SelectedOrigin }}{{ else }}Nigeria{{ end }}</span>
            <span class="material-symbols-outlined text-[20px] text-earth-accent pointer-events-none">expand_more</span>
        </button>
        <div class="dropdown-menu hidden absolute top-full left-0 w-full mt-1 bg-earth-espresso border border-earth-accent/40 text-earth-cream shadow-2xl z-50 max-h-60 overflow-y-auto rounded-none"
            role="listbox" aria-labelledby="listing-origin-label">
            {{ template "custom_country_options" dict "Selected" .SelectedOrigin }}
        </div>
    </div>
</div>
{{ end }}
