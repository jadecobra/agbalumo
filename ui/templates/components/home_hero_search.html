{{ define "home_hero_search" }}
<!-- Editorial Hero Section -->
<div id="home-hero" role="region" aria-label="Hero banner" class="relative w-full bg-earth-dark border-b border-earth-clay/20 overflow-hidden" data-agent-template="home_hero_search.html">
    <picture class="block w-full">
        <source media="(max-width: 640px)" srcset="/static/images/agbalumo_cover_photo_mobile.webp" type="image/webp">
        <source srcset="/static/images/agbalumo_cover_photo.webp" type="image/webp">
        <img src="/static/images/agbalumo_cover_photo.png"
            alt="agbalumo: find what you want"
            width="1376"
            height="768"
            fetchpriority="high"
            loading="eager"
            decoding="async"
            class="hero-banner-image">
    </picture>
    <div class="relative w-full bg-earth-dark/95 border-t border-earth-clay/20 px-4 py-2">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <p class="text-[11px] md:text-[12px] text-earth-sand/90 font-light tracking-tight">
                Right now the strongest part of our network is Nigerian and West African food in Dallas and a few cities in the Northeast.
            </p>
        </div>
    </div>
</div>
{{ end }}
