{{ define "custom_country_options" }}
{{ $selected := .Selected }}
<button type="button" data-dropdown-value="" role="option" aria-selected="{{ if not $selected }}true{{ else }}false{{ end }}"
    class="w-full text-left px-5 h-11 flex items-center text-[10px] font-bold uppercase tracking-widest transition-colors border-b border-earth-accent/10 hover:bg-earth-accent/10 text-earth-cream">Select Country</button>

{{ range Countries }}
<div class="px-5 py-2 bg-earth-dark/40 border-b border-earth-accent/10 text-[10px] font-bold uppercase tracking-widest text-earth-accent mt-2">{{ .Region }}</div>
    {{ range .Countries }}
    <button type="button" data-dropdown-value="{{ .Name }}" 
        role="option"
        aria-selected="{{ if eq .Name $selected }}true{{ else }}false{{ end }}"
        class="w-full text-left px-5 h-11 flex items-center text-[10px] font-bold uppercase tracking-widest transition-colors border-b border-earth-accent/10 text-earth-cream hover:bg-earth-accent/10 {{ if eq .Name $selected }}bg-earth-accent/20 text-earth-accent font-extrabold{{ end }}">
        {{ .Name }} {{ .Flag }}
    </button>
    {{ end }}
{{ end }}
{{ end }}
