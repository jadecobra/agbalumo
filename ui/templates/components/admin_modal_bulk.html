{{ define "admin_modal_bulk.html" }}
<div id="uploadModal" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog"
    aria-modal="true">
    <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-earth-dark/90 transition-opacity backdrop-blur-sm" aria-hidden="true"
            @click="$el.closest('#admin-modal-container').innerHTML = ''"></div>
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
        <div
            class="inline-block align-bottom bg-earth-dark border border-earth-accent/30 text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-xl w-full p-8 relative rounded-none">

            <button @click="$el.closest('#admin-modal-container').innerHTML = ''"
                aria-label="Close"
                class="absolute top-6 right-6 text-earth-sand/70 hover:text-white transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>

            <div class="flex items-center gap-4 mb-8">
                <div
                    class="w-14 h-14 bg-earth-accent/10 flex items-center justify-center text-earth-accent border border-earth-accent/30 rounded-none">
                    <span class="material-symbols-outlined text-[28px]">csv</span>
                </div>
                <h2 class="text-3xl font-serif text-white capitalize tracking-tight">Bulk Upload</h2>
            </div>

            <form id="bulkUploadForm" action="/admin/upload" method="POST" enctype="multipart/form-data"
                class="space-y-8"
                hx-on:click="if(!confirm('Are you sure you want to upload this CSV document?')) event.preventDefault()">
                <input type="hidden" name="_csrf" value="{{ .CSRF }}">

                <div id="csvUploadDropzone"
                    class="border border-dashed border-earth-accent/30 p-12 text-center hover:border-earth-accent transition-colors bg-earth-espresso/30 cursor-pointer group relative transition-all duration-300 rounded-none">
                    <input type="file" id="csvFileInput" name="csv_file" accept=".csv" required
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                    <div class="relative z-0">
                        <span id="csvUploadIcon"
                            class="material-symbols-outlined text-earth-sand/40 text-4xl mb-4 group-hover:text-earth-accent transition-colors">add</span>
                        <p id="csvUploadText" class="text-[10px] font-bold capitalize tracking-[0.2em] text-earth-cream/60">
                            Choose CSV File
                        </p>
                    </div>
                </div>

                <div class="bg-earth-espresso/40 p-6 shadow-inner border border-earth-accent/20 rounded-none">
                    <p class="text-[10px] font-bold text-white capitalize tracking-widest mb-3">Requirements</p>
                    <p class="text-[10px] font-bold capitalize tracking-widest text-earth-sand/70 leading-relaxed">
                        Required columns: <span class="text-earth-accent">title, type, description</span><br>
                        Optional: <span class="text-earth-cream italic">email, phone, category, city</span>
                    </p>
                </div>

                <div class="flex justify-end gap-4">
                    <button type="button" @click="$el.closest('#admin-modal-container').innerHTML = ''"
                        class="bg-earth-dark/60 hover:bg-earth-dark/80 text-earth-cream border border-earth-accent/20 hover:border-earth-accent/40 px-8 py-3 font-bold capitalize text-xs tracking-widest transition-all rounded-none">
                        Close
                    </button>
                    <button type="submit" id="csvUploadBtn" disabled
                        class="bg-gradient-to-r from-earth-accent to-earth-ochre hover:brightness-110 active:scale-[0.98] text-earth-dark px-10 py-3 font-extrabold capitalize text-xs tracking-[0.2em] transition-all disabled:opacity-30 disabled:grayscale rounded-none">
                        Upload CSV
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}
