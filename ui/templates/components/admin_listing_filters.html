{{ define "admin_listing_filters" }}
<div class="bg-gradient-to-b from-earth-espresso to-earth-dark shadow-md py-4 px-6 mb-8 border border-earth-accent/30 flex flex-col md:flex-row md:items-center justify-between gap-4 rounded-none">
    <div class="flex flex-wrap gap-2 items-center">
        <a href="/admin/listings"
            class="px-4 py-2 text-xs font-bold uppercase tracking-wider transition-all border {{ if not .Category }}bg-earth-accent text-earth-dark border-earth-accent shadow-sm{{ else }}bg-earth-dark/60 text-earth-sand/80 border-earth-accent/30 hover:border-earth-accent/60 hover:text-white{{ end }}">All
            ({{.TotalCount}})</a>
        {{ range .Categories }}
        <a href="/admin/listings?category={{ .Name }}{{ if $.QueryText }}&q={{ $.QueryText }}{{ end }}"
            class="px-4 py-2 text-xs font-bold uppercase tracking-wider transition-all border {{ if eq $.Category .Name }}bg-earth-accent text-earth-dark border-earth-accent shadow-sm{{ else }}bg-earth-dark/60 text-earth-sand/80 border-earth-accent/30 hover:border-earth-accent/60 hover:text-white{{ end }}">{{
            .Name }}
            ({{index $.Counts .Name}})</a>
        {{ end }}
    </div>
    
    <div class="w-full md:w-auto">
        <form action="/admin/listings" method="GET" class="flex w-full md:w-64 max-w-md relative">
            {{ if .Category }}
            <input type="hidden" name="category" value="{{ .Category }}">
            {{ end }}
            <div class="relative w-full">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-earth-sand/60">
                    <span class="material-symbols-outlined text-[18px]">search</span>
                </div>
                <input type="text" name="q" placeholder="Search..." value="{{ .QueryText }}"
                    class="block w-full pl-10 pr-3 py-2 border border-earth-accent/30 bg-earth-dark/60 text-white placeholder:text-earth-sand/50 shadow-sm focus:outline-none focus:border-earth-accent sm:text-sm rounded-none transition-all" />
            </div>
            {{ if .QueryText }}
            <a href="/admin/listings{{ if .Category }}?category={{ .Category }}{{ end }}" class="flex items-center justify-center px-3 py-2 border border-l-0 border-earth-accent/30 bg-earth-dark/60 text-earth-sand/60 hover:text-white hover:bg-earth-espresso transition-all rounded-none" title="Clear Search">
                <span class="material-symbols-outlined text-[18px]">close</span>
            </a>
            {{ end }}
        </form>
    </div>
</div>
{{ end }}
