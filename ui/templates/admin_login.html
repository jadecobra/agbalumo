<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin Login - agbalumo</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
        rel="stylesheet" />
    <link href="/static/css/output.css" rel="stylesheet" />
</head>

<body
    class="bg-earth-dark font-sans text-earth-cream antialiased h-screen flex items-center justify-center selection:bg-earth-accent/20">
    <div
        class="w-full max-w-md p-8 bg-gradient-to-b from-earth-espresso to-earth-dark border border-earth-accent/30 shadow-2xl relative overflow-hidden rounded-none">
        <div class="flex flex-col items-center justify-center gap-6">
            <div class="flex flex-col items-center gap-1.5 text-center">
                <h1 class="text-3xl font-bold font-serif text-white tracking-tight">Admin Access</h1>
                <p class="text-xs text-earth-sand/80 font-medium">Enter your administrative authorization code</p>
            </div>

            <form method="POST" action="/admin/login" class="flex flex-col gap-5 w-full mt-2">
                {{if .Error}}
                <div class="bg-red-900/40 text-red-300 p-3 text-sm border border-red-800 text-center font-medium rounded-none">
                    {{.Error}}
                </div>
                {{end}}

                <div class="flex flex-col gap-2">
                    <input type="hidden" id="admin-login-csrf" name="_csrf" value="{{.CSRF}}">
                    <label for="admin-code" class="text-xs font-bold text-earth-sand/90 uppercase tracking-wider">Access Code</label>
                    <input id="admin-code" type="password" name="code" placeholder="Enter code" required
                        class="w-full bg-earth-dark/60 border border-earth-accent/30 px-4 py-3 text-sm focus:ring-0 focus:border-earth-accent outline-none transition-all text-white font-medium placeholder:text-stone-400 rounded-none">
                </div>

                <button type="submit"
                    class="h-12 w-full mt-2 bg-gradient-to-r from-earth-accent to-earth-ochre hover:brightness-110 active:scale-[0.98] text-earth-dark font-extrabold shadow-md rounded-none transition-all text-xs uppercase tracking-wider">
                    Enter Dashboard
                </button>

                <a href="/" class="text-xs font-bold text-earth-sand/70 hover:text-earth-accent uppercase tracking-wider transition-colors mt-2 text-center">
                    ← Return to Directory
                </a>
            </form>
        </div>
    </div>
</body>

</html>
