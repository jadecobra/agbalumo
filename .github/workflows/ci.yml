name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build CSS
        run: |
          npm ci
          npm run build:css

      - name: Build Server
        run: go build -o server .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-assets
          path: |
            server
            ui/styles.css
          retention-days: 1

  quality_lint:
    name: Lint Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-assets

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Linter (GolangCI-Lint)
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: Enforce Field Alignment
        run: go run golang.org/x/tools/go/analysis/passes/fieldalignment/cmd/fieldalignment@latest ./...

      - name: Codebase Critique
        run: go run ./cmd/verify critique

  security_static:
    name: Security Static Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Pattern Checks (verify security-static)
        run: go run ./cmd/verify audit --mode=static

  test:
    name: Tests & Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run Tests with Coverage
        run: |
          mkdir -p .tester/coverage
          go test -race -coverprofile=.tester/coverage/coverage.out -count=1 ./...

      - name: Verify Coverage Threshold (Refactored)
        run: go run ./cmd/verify coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: .tester/coverage/coverage.out
          retention-days: 14

  security_dynamic:
    name: Security Dynamic Audit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-assets

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Start Server (Background)
        run: |
          chmod +x server
          mkdir -p .tester/data .tester/servers certs
          openssl req -x509 -newkey rsa:4096 -keyout certs/key.pem -out certs/cert.pem -days 365 -nodes -subj "/CN=localhost"
          export AGBALUMO_ENV=test
          export DISABLE_RATE_LIMIT=true
          ./server seed
          nohup ./server serve > .tester/servers/server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in {1..20}; do
            if curl -k -s https://localhost:8443 > /dev/null; then
              echo "Server is up!"
              break
            fi
            echo "Waiting..."
            sleep 0.5
          done
          if ! curl -k -s https://localhost:8443 > /dev/null; then
            echo "Server failed to start:"
            cat .tester/servers/server.log
            exit 1
          fi

      - name: Run Dynamic Security Audit
        run: go run ./cmd/verify audit --mode=dynamic

  e2e_tests:
    name: E2E Tests (Playwright)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-assets

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.1.1
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers & Deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        timeout-minutes: 5

      - name: Install Playwright System Dependencies (if cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
        timeout-minutes: 5

      - name: Start Server (Background)
        run: |
          chmod +x server
          mkdir -p .tester/data .tester/servers certs
          openssl req -x509 -newkey rsa:4096 -keyout certs/key.pem -out certs/cert.pem -days 365 -nodes -subj "/CN=localhost"
          export AGBALUMO_ENV=test
          export DISABLE_RATE_LIMIT=true
          ./server seed
          nohup ./server serve > .tester/servers/server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in {1..20}; do
            if curl -k -s https://localhost:8443 > /dev/null; then
              echo "Server is up!"
              break
            fi
            echo "Waiting..."
            sleep 0.5
          done
          if ! curl -k -s https://localhost:8443 > /dev/null; then
            echo "Server failed to start:"
            cat .tester/servers/server.log
            exit 1
          fi

      - name: Run Playwright Tests
        run: go run ./cmd/verify browser --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14


  drift_checks:
    name: Drift Verification
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-assets

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: API Drift Check
        run: go run ./cmd/verify api-spec

      - name: Template Function Drift Check
        run: go run ./cmd/verify template-drift

  docker:
    name: Docker Build & Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-assets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and Load Image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          load: true
          tags: agbalumo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: 'v0.70.0'
          image-ref: 'agbalumo:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


  deploy:
    name: Deploy to Fly.io
    needs: [quality_lint, security_static, test, security_dynamic, drift_checks, docker, e2e_tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install and Deploy to Fly.io
        run: |
          # Install flyctl with retries
          for i in {1..5}; do
            echo "Attempt $i: Installing flyctl..."
            if curl -fsSL https://fly.io/install.sh | sh; then
              echo "flyctl installed successfully!"
              export PATH="$HOME/.fly/bin:$PATH"
              break
            fi
            if [ $i -lt 5 ]; then
              sleep 15
            fi
            if [ $i -eq 5 ]; then
              echo "Failed to install flyctl after 5 attempts."
              exit 1
            fi
          done

          # Add to GITHUB_PATH for subsequent steps (if any)
          echo "$HOME/.fly/bin" >> $GITHUB_PATH
          export PATH="$HOME/.fly/bin:$PATH"

          # Deploy to Fly.io with retries
          for i in {1..5}; do
            echo "Attempt $i: Deploying to Fly.io..."
            if flyctl deploy --remote-only; then
              echo "Deployment successful!"
              exit 0
            fi
            if [ $i -lt 5 ]; then
              sleep_time=$(( 20 * i ))
              echo "Deployment failed. Retrying in $sleep_time seconds..."
              sleep $sleep_time
            fi
          done
          echo "Deployment failed after 5 attempts."
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
